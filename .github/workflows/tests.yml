name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check scripts tests
      - run: python -m ruff format --check scripts tests
      - name: Verify the real signed fixture with OpenSSL
        run: python -c "import sys; sys.path.insert(0, 'tests'); from network_smoke import verify_signed_fixture; assert verify_signed_fixture()['cryptographic_integrity_verified']"
      - name: Require benchmark evidence for the exact runtime
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys
          sys.path.insert(0, 'scripts')
          import add_bookmarks
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          report = json.loads(pathlib.Path('tests/benchmark_results.json').read_text())
          assert report.get('complete') is True
          sys.path.insert(0, 'tests')
          import network_smoke
          expected = set(network_smoke.SOURCES) | {'zh-low'}
          names = [row['name'] for row in report['results']]
          assert expected <= set(names)
          assert len(names) == len(set(names))
          assert report['version'] == add_bookmarks.VERSION
          assert report['implementation_sha256'] == {p.name: digest(p) for p in sorted(pathlib.Path('scripts').glob('*.py'))}
          assert report['benchmark_sha256'] == digest(pathlib.Path('tests/network_smoke.py'))
          for line in pathlib.Path('requirements.txt').read_text().splitlines():
              if line and not line.startswith('#'):
                  name, version = line.split('==')
                  assert report['environment'][name] == version
          for row in report['results']:
              assert row['input_outline_count'] == 0
              if row['bookmarks']:
                  assert row['automatic_content_preserved'] is True
              else:
                  assert row['automatic_content_preserved'] is None
                  assert row['recognition_failure'] == 'no_headings'
                  assert row['reviewed_toc_verified'] is True
          held_out = [row for row in report['results'] if row['evaluation_role'] == 'independent_held_out']
          assert len(held_out) >= 2
          for row in held_out:
              assert row['metrics']['unscored_candidates'] == 0
              assert row['metrics']['scored_candidates'] == row['bookmarks'] == len(row['candidate_review'])
              assert sum(row['assessment_counts'].values()) == row['bookmarks']
          PY
      - name: Verify npx project and global installation
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          python - <<'PY'
          import os, pathlib, shutil
          source = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'skill-source'
          for relative in ['SKILL.md', 'requirements.txt', 'LICENSE'] + [str(p.relative_to(source)) for p in (source / 'scripts').glob('*.py')]:
              destination = target / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source / relative, destination)
          PY
          skill_source="$RUNNER_TEMP/skill-source"
          mkdir -p "$RUNNER_TEMP/skill-install"
          cd "$RUNNER_TEMP/skill-install"
          npm ci --prefix "$GITHUB_WORKSPACE/.github/skills" --ignore-scripts
          "$GITHUB_WORKSPACE/.github/skills/node_modules/.bin/skills" add "$skill_source" --agent codex claude-code cursor opencode --copy --yes
          python -c "from pathlib import Path; assert Path('.agents/skills/pdf-add-bookmarks/scripts/add_bookmarks.py').is_file(); assert Path('.claude/skills/pdf-add-bookmarks/requirements.txt').is_file(); assert Path('.agents/skills/pdf-add-bookmarks/scripts/ocr.py').is_file(); assert Path('.agents/skills/pdf-add-bookmarks/scripts/headings.py').is_file()"
          "$GITHUB_WORKSPACE/.github/skills/node_modules/.bin/skills" add "$skill_source" --agent codex claude-code cursor opencode --global --copy --yes
          python -c "from pathlib import Path; root = Path.home()/'.agents/skills/pdf-add-bookmarks'; assert all((root/'scripts'/name).is_file() for name in ['add_bookmarks.py', 'headings.py', 'ocr.py']); assert (Path.home()/'.claude/skills/pdf-add-bookmarks/requirements.txt').is_file()"
          python .agents/skills/pdf-add-bookmarks/scripts/add_bookmarks.py --version
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng
      - name: Install pinned Windows OCR engine
        if: runner.os == 'Windows'
        shell: python
        run: |
          import hashlib, os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          installer = root / 'tesseract-5.5.0.exe'
          url = 'https://github.com/tesseract-ocr/tesseract/releases/download/5.5.0/tesseract-ocr-w64-setup-5.5.0.20241111.exe'
          with urllib.request.urlopen(url, timeout=60) as response:
              installer.write_bytes(response.read())
          assert hashlib.sha256(installer.read_bytes()).hexdigest() == 'f3fc4236425b690c8be756f35793f77394ee004be0a6460a440c754d892f68bc'
          target = pathlib.Path(os.environ['ProgramFiles']) / 'Tesseract-OCR'
          subprocess.run([str(installer), '/S', '/ALLUSERS'], check=True, timeout=120)
          assert (target / 'tesseract.exe').is_file()
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(str(target) + '\n')
      - if: runner.os == 'macOS'
        run: |
          brew install tesseract
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "/usr/local/bin" >> $GITHUB_PATH
      - name: Prepare OCR language data
        shell: python
        run: |
          import hashlib, os, pathlib, urllib.request
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ocr-languages'
          target.mkdir(exist_ok=True)
          hashes = {'eng': '7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2', 'chi_sim': 'a5fcb6f0db1e1d6d8522f39db4e848f05984669172e584e8d76b6b3141e1f730'}
          for language, expected in hashes.items():
              file = target / f'{language}.traineddata'
              urllib.request.urlretrieve(f'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/{language}.traineddata', file)
              assert hashlib.sha256(file.read_bytes()).hexdigest() == expected, language
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'TESSDATA_PREFIX={target}\n')
      - name: Require working OCR
        run: python -c "import sys; sys.path.insert(0, 'scripts'); from add_bookmarks import ensure_tesseract; import pytesseract; assert ensure_tesseract(); assert {'eng', 'chi_sim'} <= set(pytesseract.get_languages())"
      - name: Run project tests
        run: python -m pytest -q --junitxml=tests/output/pytest.xml
        env:
          REQUIRE_OCR: '1'
      - name: Report executed project tests
        shell: python
        run: |
          import os, pathlib, xml.etree.ElementTree as ET
          suites = ET.parse('tests/output/pytest.xml').getroot().findall('testsuite')
          counts = {key: sum(int(suite.get(key, 0)) for suite in suites) for key in ['tests', 'failures', 'errors', 'skipped']}
          assert counts['tests'] > 0 and counts['failures'] == counts['errors'] == counts['skipped'] == 0, counts
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write(f"Project pytest: {counts['tests']} passed, 0 skipped. Independent OpenSSL and installation checks are reported separately.\n")
  release:
    needs: [quality, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Publish a new version after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skill_version=$(python -c "import sys; sys.path.insert(0, 'scripts'); import add_bookmarks; print(add_bookmarks.VERSION)")
          if gh release view "v$skill_version" >/dev/null 2>&1; then
            echo "Version v$skill_version is already released."
            exit 0
          fi
          python - <<'PY'
          import hashlib, pathlib, zipfile
          files = ['SKILL.md', 'requirements.txt', 'LICENSE'] + sorted(str(p) for p in pathlib.Path('scripts').glob('*.py'))
          with zipfile.ZipFile('pdf-add-bookmarks.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for file in files:
                  archive.write(file, 'pdf-add-bookmarks/' + file)
          pathlib.Path('benchmark-results.json').write_bytes(pathlib.Path('tests/benchmark_results.json').read_bytes())
          paths = [pathlib.Path('pdf-add-bookmarks.zip'), pathlib.Path('benchmark-results.json')]
          pathlib.Path('SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in paths))
          PY
          gh release create "v$skill_version" pdf-add-bookmarks.zip benchmark-results.json SHA256SUMS.txt --target "$GITHUB_SHA" --title "PDF Add Bookmarks v$skill_version" --notes-file <(python -c "from pathlib import Path; print(Path('README.md').read_text().split('<!-- release-notes -->')[1].strip())")
      - name: Smoke test the public Release ZIP
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix .github/skills --ignore-scripts
          skill_version=$(python scripts/add_bookmarks.py --version | awk '{print $2}')
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$skill_version"
          export RELEASE_URL="$release_url"
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request, zipfile
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-smoke'
          target.mkdir()
          for name in ['SHA256SUMS.txt', 'pdf-add-bookmarks.zip', 'benchmark-results.json']:
              with urllib.request.urlopen(os.environ['RELEASE_URL'] + '/' + name, timeout=60) as response:
                  (target / name).write_bytes(response.read())
          for line in (target / 'SHA256SUMS.txt').read_text().splitlines():
              digest, name = line.split()
              assert name in {'pdf-add-bookmarks.zip', 'benchmark-results.json'}
              assert hashlib.sha256((target / name).read_bytes()).hexdigest() == digest
          with zipfile.ZipFile(target / 'pdf-add-bookmarks.zip') as archive:
              expected = ['SKILL.md', 'requirements.txt', 'LICENSE'] + sorted(str(p) for p in pathlib.Path('scripts').glob('*.py'))
              assert sorted(archive.namelist()) == sorted('pdf-add-bookmarks/' + p for p in expected)
              for path in expected:
                  assert archive.read('pdf-add-bookmarks/' + path) == pathlib.Path(path).read_bytes()
          assert (target / 'benchmark-results.json').read_bytes() == pathlib.Path('tests/benchmark_results.json').read_bytes()
          PY
          installer="$GITHUB_WORKSPACE/.github/skills/node_modules/.bin/skills"
          cd "$RUNNER_TEMP/release-smoke"
          "$installer" add "$release_url/pdf-add-bookmarks.zip" --agent codex claude-code cursor opencode --copy --yes
          "$installer" add "$release_url/pdf-add-bookmarks.zip" --agent codex claude-code cursor opencode --global --copy --yes
          python - <<'PY'
          import fitz, json, pathlib, subprocess, sys
          project = pathlib.Path('.agents/skills/pdf-add-bookmarks')
          for root in [project, pathlib.Path('.claude/skills/pdf-add-bookmarks'), pathlib.Path.home()/'.agents/skills/pdf-add-bookmarks', pathlib.Path.home()/'.claude/skills/pdf-add-bookmarks']:
              assert all((root/'scripts'/name).is_file() for name in ['add_bookmarks.py', 'headings.py', 'ocr.py'])
          with fitz.open() as doc:
              page = doc.new_page()
              page.insert_text((60, 80), 'Chapter 1 Release installation', fontsize=24)
              page.insert_text((60, 140), 'Ordinary body text stays unchanged.', fontsize=12)
              doc.save('source.pdf')
          completed = subprocess.run([sys.executable, str(project/'scripts/add_bookmarks.py'), 'source.pdf', '--verify', 'full', '--json'], capture_output=True, text=True, check=True)
          result = json.loads(completed.stdout)
          assert result['bookmarks'] == 1 and result['review_required'] is True
          with fitz.open(result['output']) as doc:
              assert doc.get_toc() == [[1, 'Chapter 1 Release installation', 1]]
              assert doc.pagemode == 'UseOutlines'
          PY
