name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check scripts tests
      - run: python -m ruff format --check scripts tests
      - name: Verify npx project and global installation
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/skill-install"
          cd "$RUNNER_TEMP/skill-install"
          npx --yes skills add "$GITHUB_WORKSPACE" --agent codex claude-code cursor opencode --copy --yes
          python -c "from pathlib import Path; assert Path('.agents/skills/pdf-add-bookmarks/scripts/add_bookmarks.py').is_file(); assert Path('.claude/skills/pdf-add-bookmarks/requirements.txt').is_file()"
          npx --yes skills add "$GITHUB_WORKSPACE" --agent codex claude-code cursor opencode --global --copy --yes
          python -c "from pathlib import Path; assert (Path.home()/'.agents/skills/pdf-add-bookmarks/scripts/add_bookmarks.py').is_file(); assert (Path.home()/'.claude/skills/pdf-add-bookmarks/requirements.txt').is_file()"
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng
      - if: runner.os == 'Windows'
        run: |
          choco install tesseract --yes --no-progress
          echo "C:\Program Files\Tesseract-OCR" >> $env:GITHUB_PATH
      - if: runner.os == 'macOS'
        run: |
          brew install tesseract
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "/usr/local/bin" >> $GITHUB_PATH
      - name: Prepare OCR language data
        shell: python
        run: |
          import os, pathlib, urllib.request
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ocr-languages'
          target.mkdir(exist_ok=True)
          for language in ('eng', 'chi_sim'):
              urllib.request.urlretrieve(f'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/{language}.traineddata', target / f'{language}.traineddata')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'TESSDATA_PREFIX={target}\n')
      - name: Require working OCR
        run: python -c "import sys; sys.path.insert(0, 'scripts'); from add_bookmarks import ensure_tesseract; import pytesseract; assert ensure_tesseract(); assert {'eng', 'chi_sim'} <= set(pytesseract.get_languages())"
      - run: python -m pytest -q
        env:
          REQUIRE_OCR: '1'
  release:
    needs: [quality, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish a new version after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skill_version=$(python -c "import sys; sys.path.insert(0, 'scripts'); import add_bookmarks; print(add_bookmarks.VERSION)")
          if gh release view "v$skill_version" >/dev/null 2>&1; then
            echo "Version v$skill_version is already released."
            exit 0
          fi
          python - <<'PY'
          import hashlib, pathlib, zipfile
          files = ['SKILL.md', 'scripts/add_bookmarks.py', 'requirements.txt', 'LICENSE']
          with zipfile.ZipFile('pdf-add-bookmarks.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for file in files:
                  archive.write(file, 'pdf-add-bookmarks/' + file)
          path = pathlib.Path('pdf-add-bookmarks.zip')
          pathlib.Path('SHA256SUMS.txt').write_text(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n')
          PY
          gh release create "v$skill_version" pdf-add-bookmarks.zip SHA256SUMS.txt --target "$GITHUB_SHA" --title "PDF Add Bookmarks v$skill_version" --notes-file <(python -c "from pathlib import Path; print(Path('README.md').read_text().split('<!-- release-notes -->')[1].strip())")
