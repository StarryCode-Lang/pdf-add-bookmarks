name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng
      - if: runner.os == 'Windows'
        run: |
          choco install tesseract --yes --no-progress
          echo "C:\Program Files\Tesseract-OCR" >> $env:GITHUB_PATH
      - if: runner.os == 'macOS'
        run: |
          brew install tesseract
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "/usr/local/bin" >> $GITHUB_PATH
      - name: Prepare OCR language data
        shell: python
        run: |
          import os, pathlib, urllib.request
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ocr-languages'
          target.mkdir(exist_ok=True)
          for language in ('eng', 'chi_sim'):
              urllib.request.urlretrieve(f'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/{language}.traineddata', target / f'{language}.traineddata')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'TESSDATA_PREFIX={target}\n')
      - name: Verify OCR is available (non-blocking)
        continue-on-error: true
        run: |
          python -c "
          import sys, shutil
          sys.path.insert(0, 'scripts')
          from add_bookmarks import ensure_tesseract, find_tesseract
          import pytesseract
          print('tesseract which:', shutil.which('tesseract'))
          print('find_tesseract:', find_tesseract())
          ok = ensure_tesseract()
          print('ensure_tesseract:', ok)
          if ok:
              langs = set(pytesseract.get_languages())
              print('languages:', sorted(langs))
              print('required present:', {'eng', 'chi_sim'} <= langs)
          else:
              print('OCR not ready; OCR-marked tests will be skipped')
          "
      - run: python -m pytest -q
