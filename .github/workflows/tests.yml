name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim
      - if: runner.os == 'Windows'
        run: choco install tesseract --yes --no-progress
      - if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Prepare OCR language data
        shell: python
        run: |
          import os, pathlib, urllib.request
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ocr-languages'
          target.mkdir(exist_ok=True)
          for language in ('eng', 'chi_sim'):
              urllib.request.urlretrieve(f'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/{language}.traineddata', target / f'{language}.traineddata')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'TESSDATA_PREFIX={target}\n')
      - name: Verify OCR is available
        run: python -c "import sys; sys.path.insert(0, 'scripts'); from add_bookmarks import ensure_tesseract; import pytesseract; assert ensure_tesseract(); assert {'eng', 'chi_sim'} <= set(pytesseract.get_languages())"
      - run: python -m pytest -q
